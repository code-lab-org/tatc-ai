services:
  mcp-server:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: tatc-ai-mcp-server-dev
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      USAGE_LOG_PATH: /data/usage/usage.jsonl
    volumes:
      - usage-data:/data/usage
    ports:
      - "8000:8000"

  mongodb:
    image: mongo:7
    container_name: tatc-ai-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: tatc-ai-librechat-dev
    env_file:
      - apps/librechat/.env.example
    volumes:
      - ./apps/librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      - mongodb
      - mcp-server
    ports:
      - "3080:3080"

volumes:
  mongodb-data:
  usage-data:
