version: 1.3.13
cache: true

mcpSettings:
  allowedDomains:
    - "mcp-server"

mcpServers:
  tatc:
    type: streamable-http
    url: http://mcp-server:8000/mcp
    timeout: 600000
    initTimeout: 15000
    serverInstructions: true
    chatMenu: true
    startup: true

endpoints:
  custom:
    # Voyager chat models are grouped here instead of under the built-in
    # OpenAI label.
    # TATC AI offers a short list: the top ASU Voyager models on the
    # Artificial Analysis Intelligence Index that can call tools. The proxy
    # serves more; to offer one, add its ID here and a modelSpecs entry
    # below, in both this file and the other librechat file, then run the
    # tool-calling eval in apps/mcp-server/eval with --models to check it.
    # fetch stays off so only the listed models appear in the picker.
    - name: ASU Voyager
      apiKey: ${VOYAGER_API_KEY}
      baseURL: ${VOYAGER_BASE_URL}
      models:
        default:
          - glm-5-3
          - glm-5-3-flash
          - deepseek-v4-1-flash
          - mimo-v2-6-flash
          - qwen38-27b
        fetch: false
      titleConvo: true
      titleModel: qwen38-27b
      modelDisplayLabel: ASU Voyager
    # Only models verified for chat, streaming, and tool calls are listed;
    # the API also serves embedding, speech, image, and realtime models.
    - name: ASU CreateAI
      apiKey: ${CREATEAI_API_KEY}
      baseURL: ${CREATEAI_BASE_URL}
      models:
        default:
          - aws/nova2-lite
          - aws/nova-lite
          - aws/nova-micro
          - aws/nova-pro
          - aws/claude4_5_haiku
          - aws/claude4_sonnet
          - aws/claude4_5_sonnet
          - aws/claude5_sonnet
          - aws/claude4_1_opus
          - aws/claude4_5_opus
          - aws/claude4_6_opus
          - aws/claude4_7_opus
          - aws/claude4_8_opus
          - aws/claude5_opus
          - gcp-deepmind/geminiflash2_5
          - gcp-deepmind/geminiflash2_5-lite
          - gcp-deepmind/geminiflash3
          - gcp-deepmind/geminiflash3_1_lite
          - gcp-deepmind/geminipro3_1
          - gcp-deepmind/geminiflash3_5
          - gcp-deepmind/geminiflash3_7
          - asu-air/gemma4_31b_it
          - asu-air/llama4_maverick-17b
          - asu-air/llama4_scout-17b
          - asu-air/muse-glimmer-30b
          - aws/gpt-oss-20b
          - aws/gpt-oss-120b
          - openai/gpt4o_mini
          - openai/gpt4_1
          - openai/gpt4_1-mini
          - openai/o3
          - openai/gpt5
          - openai/gpt5_mini
          - openai/gpt5_nano
          - openai/gpt5_1
          - openai/gpt5_1_instant
          - openai/gpt5_1_thinking
          - openai/gpt5_2
          - openai/gpt5_2_pro
          - openai/gpt5_4_mini
          - openai/gpt5_4_nano
          - openai/gpt5_4_thinking
          - openai/gpt5_4_pro
          - openai/gpt5_5
          - openai/gpt5_5_thinking
          - openai/gpt5_5_pro
          - openai/gpt5_6_luna
          - openai/gpt5_6_sol
          - openai/gpt5_6_terra
          - openai/gpt6_astra
        fetch: false
      titleConvo: true
      titleModel: aws/claude4_5_haiku
      modelDisplayLabel: ASU CreateAI

interface:
  customWelcome: 'Welcome to TATC AI - ask about satellites, orbits, and ground tracks.'
  modelSelect: false
  parameters: true
  presets: false
  defaultPinnedTools:
    - tatc

modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: glm-5-3
      label: GLM-5.3
      description: Z.ai GLM chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: https://github.com/zai-org.png
      showIconInMenu: true
      showIconInHeader: true
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: glm-5-3
    - name: glm-5-3-flash
      label: GLM-5.3-Flash
      description: Z.ai GLM chat model via ASU Voyager.
