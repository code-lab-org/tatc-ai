    - name: qwen38-27b
      label: Qwen 3.8 27B
      description: Alibaba Qwen chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: /assets/qwen.svg
      showIconInMenu: true
      showIconInHeader: true
      default: true
      showOnLanding: true
      conversation_starters:
        - Find three satellites with Hubble in their name and show their NORAD IDs.
        - What are the current orbital elements for NORAD ID 25544?
        - Show the ISS ground track for the next 10 minutes at one-minute intervals.
        - How often can Terra see Phoenix, Arizona over the next 24 hours? Use a 110 degree field of regard from the NASA MODIS design page.
        - How often can Sentinel-2A and Sentinel-2B together see Phoenix, Arizona in daylight over the next 60 days?
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: qwen38-27b
