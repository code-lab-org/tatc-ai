version: 1.3.13
cache: true

mcpSettings:
  allowedDomains:
    - "mcp-server"

mcpServers:
  tatc:
    type: streamable-http
    url: http://mcp-server:8000/mcp
    timeout: 600000
    initTimeout: 15000
    serverInstructions: true
    chatMenu: true
    startup: true

endpoints:
  custom:
    # All chat models come from ASU Voyager for now, so they are grouped
    # here instead of under the built-in OpenAI label. The key and proxy URL
    # reuse the existing OPENAI_* env vars, so no new secrets are needed.
    # TATC AI offers a short list: the top ASU Voyager models on the
    # Artificial Analysis Intelligence Index that can call tools. The proxy
    # serves more; to offer one, add its ID here and a modelSpecs entry
    # below, in both this file and the other librechat file, then run the
    # tool-calling eval in apps/mcp-server/eval with --models to check it.
    # fetch stays off so only the listed models appear in the picker.
    - name: ASU Voyager
      apiKey: ${OPENAI_API_KEY}
      baseURL: ${OPENAI_REVERSE_PROXY}
      models:
        default:
          - glm-5-3
          - glm-5-3-flash
          - deepseek-v4-1-flash
          - mimo-v2-6-flash
          - qwen38-27b
        fetch: false
      titleConvo: true
      titleModel: qwen38-27b
      modelDisplayLabel: ASU Voyager

interface:
  customWelcome: 'Welcome to TATC AI - ask about satellites, orbits, and ground tracks.'
  modelSelect: false
  parameters: true
  presets: false
  defaultPinnedTools:
    - tatc

modelSpecs:
  prioritize: true
  enforce: false
  list:
    - name: glm-5-3
      label: GLM-5.3
      description: Z.ai GLM chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: https://github.com/zai-org.png
      showIconInMenu: true
      showIconInHeader: true
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: glm-5-3
    - name: glm-5-3-flash
      label: GLM-5.3-Flash
      description: Z.ai GLM chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: https://github.com/zai-org.png
      showIconInMenu: true
      showIconInHeader: true
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: glm-5-3-flash
    - name: deepseek-v4-1-flash
      label: DeepSeek V4.1 Flash
      description: DeepSeek chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: https://github.com/deepseek-ai.png
      showIconInMenu: true
      showIconInHeader: true
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: deepseek-v4-1-flash
    - name: mimo-v2-6-flash
      label: MiMo-V2.6-Flash
      description: Xiaomi MiMo chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: https://github.com/XiaomiMiMo.png
      showIconInMenu: true
      showIconInHeader: true
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: mimo-v2-6-flash
    - name: qwen38-27b
      label: Qwen 3.8 27B
      description: Alibaba Qwen chat model via ASU Voyager.
      group: ASU Voyager
      iconURL: /assets/qwen.svg
      showIconInMenu: true
      showIconInHeader: true
      default: true
      showOnLanding: true
      conversation_starters:
        - Find three satellites with Hubble in their name and show their NORAD IDs.
        - What are the current orbital elements for NORAD ID 25544?
        - Show the ISS ground track for the next 10 minutes at one-minute intervals.
        - How often can Terra see Phoenix, Arizona over the next 24 hours? Use a 110 degree field of regard from the NASA MODIS design page.
        - How often can Sentinel-2A and Sentinel-2B together see Phoenix, Arizona in daylight over the next 60 days?
      mcpServers:
        - tatc
      preset:
        endpoint: ASU Voyager
        model: qwen38-27b
