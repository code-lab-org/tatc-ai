name: Sync Voyager models

on:
  # Mondays 13:00 UTC. ASU adds models rarely, so weekly is plenty.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needs a repo secret VOYAGER_API_KEY holding an ASU proxy key.
      - name: Sync model list
        run: |
          VOYAGER_API_KEY="${{ secrets.VOYAGER_API_KEY }}" \
          VOYAGER_BASE_URL="https://openai.rc.asu.edu/v1" \
          python3 apps/librechat/sync_voyager_models.py \
            --summary-json "$RUNNER_TEMP/sync-summary.json"

      # Additions with known branding are safe to land unattended.
      # Removals, unknown branding, or a vanishing default need a human.
      - name: Classify diff
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          summary="$RUNNER_TEMP/sync-summary.json"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "needs_review=$(jq -r .needs_review "$summary")" >> "$GITHUB_OUTPUT"
          reason=$(jq -r '
            [ if (.removed | length) > 0
                then "removed: " + (.removed | join(", ")) else empty end,
              if (.unverified | length) > 0
                then "unverified: " + (.unverified | join(", ")) else empty end,
              if (.unknown_branding | length) > 0
                then "unknown branding: " + (.unknown_branding | join(", ")) else empty end,
              if .default_vanished then "default spec vanished" else empty end ]
            | join("; ")' "$summary")
          if [ -n "$reason" ]; then
            printf 'note=Needs review: %s\n' "$reason" >> "$GITHUB_OUTPUT"
          else
            echo "note=Purely additive with known branding; auto-merging." >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR on changes
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/voyager-models
          title: Sync ASU Voyager model list
          commit-message: Sync ASU Voyager model list
          body: |
            Automated run of `apps/librechat/sync_voyager_models.py`.

            ${{ steps.diff.outputs.note }}

            Review the diff, fix any guessed labels or icons, then merge
            and the normal deploy picks it up.

      # A merge made with GITHUB_TOKEN suppresses the `on: push` deploy
      # trigger, so dispatch the deploy explicitly after merging.
      - name: Auto-merge safe diff and deploy
        if: >-
          steps.diff.outputs.changed == 'true' &&
          steps.diff.outputs.needs_review == 'false' &&
          steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.pr.outputs.pull-request-number }}" \
            --squash --delete-branch
          gh workflow run deploy.yml --ref main
