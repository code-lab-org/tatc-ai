name: Sync Voyager models

on:
  # Mondays 13:00 UTC. ASU adds models rarely, so weekly is plenty.
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needs a repo secret VOYAGER_API_KEY holding an ASU proxy key.
      # The script exits quietly non-zero when nothing changed, and
      # create-pull-request below is a no-op without a diff.
      - name: Sync model list
        run: |
          OPENAI_API_KEY="${{ secrets.VOYAGER_API_KEY }}" \
          OPENAI_REVERSE_PROXY="https://openai.rc.asu.edu/v1" \
          python3 apps/librechat/sync_voyager_models.py

      - name: Open PR on changes
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/voyager-models
          title: Sync ASU Voyager model list
          commit-message: Sync ASU Voyager model list
          body: |
            Automated run of `apps/librechat/sync_voyager_models.py`.

            Review the guessed labels and icons for new models, merge, and
            the normal deploy picks it up.
