name: Build and deploy

# One run per push to main: rebuild the MCP server image if its inputs
# changed, then redeploy EC2. The deploy waits for the build, so new config
# never runs against the old image, and a failed build deploys nothing.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs so two builds never race the `latest` tag and two SSH
# sessions never race `docker compose up -d`.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/code-lab-org/tatc-ai-mcp-server

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check MCP server image inputs
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Rebuild unless this push can be diffed and leaves the image inputs
          # unchanged. Manual runs, new branches (all-zero BEFORE) and force
          # pushes (BEFORE no longer in history) always rebuild.
          image=true
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null &&
             git diff --quiet "$BEFORE" "$SHA" -- apps/mcp-server .github/workflows/deploy.yml; then
            image=false
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [changes, build]
    # Deploy after a successful build, or right away when no build was needed.
    if: >-
      ${{ !cancelled() && needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Set up deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trust deploy host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # The deploy user's authorized_keys pins this key to a forced command
      # (config/deploy/deploy.sh on the instance), so the command given here
      # is ignored - whatever SSH runs is whatever that forced command is.
      - name: Redeploy
        run: ssh -o StrictHostKeyChecking=yes "${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_SSH_HOST }}" true
