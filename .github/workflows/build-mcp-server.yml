name: Build and push MCP server image

on:
  push:
    branches:
      - main
    paths:
      - "apps/mcp-server/**"
      - ".github/workflows/build-mcp-server.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/code-lab-org/tatc-ai-mcp-server

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
