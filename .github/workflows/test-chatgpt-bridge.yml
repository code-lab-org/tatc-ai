name: Test ChatGPT bridge

on:
  pull_request:
    paths:
      - 'apps/chatgpt-bridge/**'
      - '.github/workflows/test-chatgpt-bridge.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install requirements and pytest
        run: pip install -r apps/chatgpt-bridge/requirements.txt pytest

      - name: Run tests
        working-directory: apps/chatgpt-bridge
        run: PYTHONPATH=. python -m pytest tests
