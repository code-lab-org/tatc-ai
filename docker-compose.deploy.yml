services:
  traefik:
    image: traefik:v3.1
    container_name: tatc-ai-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    networks:
      proxy:
        aliases:
          - auth.${DOMAIN}
      app:
        aliases:
          - auth.${DOMAIN}

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: tatc-ai-dex
    command: ["/bin/sh", "/etc/dex/start-dex.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      DEX_DEV_PASSWORD_HASH: ${DEX_DEV_PASSWORD_HASH}
      DEX_LIBRECHAT_CLIENT_SECRET: ${DEX_LIBRECHAT_CLIENT_SECRET}
      DEX_MCP_CLIENT_SECRET: ${DEX_MCP_CLIENT_SECRET}
    volumes:
      - ./config/dex/start-dex.sh:/etc/dex/start-dex.sh:ro
      - dex-data:/var/dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.dex.entrypoints=websecure"
      - "traefik.http.routers.dex.tls=true"
      - "traefik.http.routers.dex.tls.certresolver=letsencrypt"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"
    networks:
      - proxy
      - app

  mcp-server:
    image: ghcr.io/code-lab-org/tatc-ai-mcp-server:${MCP_SERVER_IMAGE_TAG:-latest}
    container_name: tatc-ai-mcp-server
    environment:
      # Setting these enables OIDC auth against Dex; the dev compose leaves
      # them unset so the dev server stays open. Must match the mcp-server
      # static client in config/dex/start-dex.sh.
      MCP_OIDC_ISSUER_URL: https://auth.${DOMAIN}
      MCP_OIDC_CLIENT_ID: mcp-server
      MCP_OIDC_CLIENT_SECRET: ${DEX_MCP_CLIENT_SECRET}
      MCP_BASE_URL: https://mcp.${DOMAIN}
    depends_on:
      - dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=8000"
    networks:
      - proxy
      - app

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: tatc-ai-librechat
    env_file:
      - apps/librechat/.env
    environment:
      # LibreChat builds OIDC redirect/callback URLs from these; they default
      # to http://localhost:3080 if unset, which is why the OpenID button
      # pointed at localhost before this was set.
      DOMAIN_CLIENT: https://chat.${DOMAIN}
      DOMAIN_SERVER: https://chat.${DOMAIN}
      # Dex is the identity provider for this deployment: disable local
      # email/password signup and let OIDC logins auto-create accounts.
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"
      OPENID_ISSUER: https://auth.${DOMAIN}
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${DEX_LIBRECHAT_CLIENT_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: "openid profile email"
    volumes:
      - ./apps/librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      - mongodb
      - mcp-server
      - dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librechat.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.librechat.entrypoints=websecure"
      - "traefik.http.routers.librechat.tls=true"
      - "traefik.http.routers.librechat.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat.loadbalancer.server.port=3080"
    networks:
      - proxy
      - app

  mongodb:
    image: mongo:7
    container_name: tatc-ai-mongodb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app

networks:
  proxy:
  app:

volumes:
  dex-data:
  mongodb-data:
  letsencrypt-data:
