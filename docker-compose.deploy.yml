services:
  traefik:
    image: traefik:v3.1
    container_name: tatc-ai-traefik
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt-data:/letsencrypt
    networks:
      # mcp.<DOMAIN> needs to resolve inside the docker network too: the
      # OIDCProxy on mcp-server declares its OAuth resource/endpoints as
      # https://mcp.<DOMAIN>, and LibreChat's MCP client enforces (RFC 9728
      # §3.3) that the URL it connects to matches that resource exactly - so
      # it has to reach mcp-server via this hostname, not the internal
      # service name.
      proxy:
        aliases:
          - auth.${DOMAIN}
          - mcp.${DOMAIN}
      app:
        aliases:
          - auth.${DOMAIN}
          - mcp.${DOMAIN}

  dex:
    image: ghcr.io/dexidp/dex:v2.41.1
    container_name: tatc-ai-dex
    command: ["/bin/sh", "/etc/dex/start-dex.sh"]
    environment:
      DOMAIN: ${DOMAIN}
      DEX_DEV_PASSWORD_HASH: ${DEX_DEV_PASSWORD_HASH}
      DEX_LIBRECHAT_CLIENT_SECRET: ${DEX_LIBRECHAT_CLIENT_SECRET}
      DEX_MCP_CLIENT_SECRET: ${DEX_MCP_CLIENT_SECRET}
    volumes:
      - ./config/dex/start-dex.sh:/etc/dex/start-dex.sh:ro
      - dex-data:/var/dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dex.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.dex.entrypoints=websecure"
      - "traefik.http.routers.dex.tls=true"
      - "traefik.http.routers.dex.tls.certresolver=letsencrypt"
      - "traefik.http.services.dex.loadbalancer.server.port=5556"
    networks:
      - proxy
      - app

  mcp-server:
    image: ghcr.io/code-lab-org/tatc-ai-mcp-server:${MCP_SERVER_IMAGE_TAG:-latest}
    container_name: tatc-ai-mcp-server
    environment:
      # Setting these enables OIDC auth against Dex; the dev compose leaves
      # them unset so the dev server stays open. Must match the mcp-server
      # static client in config/dex/start-dex.sh.
      MCP_OIDC_ISSUER_URL: https://auth.${DOMAIN}
      MCP_OIDC_CLIENT_ID: mcp-server
      MCP_OIDC_CLIENT_SECRET: ${DEX_MCP_CLIENT_SECRET}
      MCP_BASE_URL: https://mcp.${DOMAIN}
      # OIDCProxy persists DCR client registrations and issued tokens under
      # this directory (encrypted with a key derived from
      # MCP_OIDC_CLIENT_SECRET, so it stays stable across restarts). Without
      # a volume here it lives on the container's writable layer and is
      # wiped on every redeploy, forcing every client to re-register.
      FASTMCP_HOME: /data/fastmcp
    volumes:
      - mcp-server-oauth:/data/fastmcp
    depends_on:
      - dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mcp.rule=Host(`mcp.${DOMAIN}`)"
      - "traefik.http.routers.mcp.entrypoints=websecure"
      - "traefik.http.routers.mcp.tls=true"
      - "traefik.http.routers.mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.mcp.loadbalancer.server.port=8000"
    networks:
      - proxy
      - app

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    container_name: tatc-ai-librechat
    env_file:
      - apps/librechat/.env
    environment:
      # LibreChat builds OIDC redirect/callback URLs from these; they default
      # to http://localhost:3080 if unset, which is why the OpenID button
      # pointed at localhost before this was set.
      DOMAIN_CLIENT: https://chat.${DOMAIN}
      DOMAIN_SERVER: https://chat.${DOMAIN}
      # Dex is the identity provider for this deployment: disable local
      # email/password signup and let OIDC logins auto-create accounts.
      ALLOW_REGISTRATION: "false"
      ALLOW_SOCIAL_LOGIN: "true"
      ALLOW_SOCIAL_REGISTRATION: "true"
      OPENID_ISSUER: https://auth.${DOMAIN}
      OPENID_CLIENT_ID: librechat
      OPENID_CLIENT_SECRET: ${DEX_LIBRECHAT_CLIENT_SECRET}
      OPENID_CALLBACK_URL: /oauth/openid/callback
      OPENID_SCOPE: "openid profile email"
      DOMAIN: ${DOMAIN}
    volumes:
      - ./apps/librechat/librechat.deploy.yaml.template:/app/librechat.yaml.template:ro
    # librechat.yaml is a bind-mounted static file, so it can't use compose's
    # own ${DOMAIN} interpolation; render it from the template into the
    # image's normal /app/librechat.yaml path on every start instead, then
    # fall through to the image's default `npm run backend` (no ENTRYPOINT
    # to preserve).
    command:
      - /bin/sh
      - -c
      - |
        sed "s/__DOMAIN__/$$DOMAIN/g" /app/librechat.yaml.template > /app/librechat.yaml
        exec npm run backend
    depends_on:
      - mongodb
      - mcp-server
      - dex
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librechat.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.librechat.entrypoints=websecure"
      - "traefik.http.routers.librechat.tls=true"
      - "traefik.http.routers.librechat.tls.certresolver=letsencrypt"
      - "traefik.http.services.librechat.loadbalancer.server.port=3080"
    networks:
      - proxy
      - app

  mongodb:
    image: mongo:7
    container_name: tatc-ai-mongodb
    volumes:
      - mongodb-data:/data/db
    networks:
      - app

networks:
  proxy:
  app:

volumes:
  dex-data:
  mongodb-data:
  mcp-server-oauth:
  letsencrypt-data:
